<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>MacEng Practice</title>
<!-- KaTeX for math rendering (used by the question view, to be rebuilt) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600..700&display=swap">
<link rel="stylesheet" href="styles.css?v=16">
</head>
<body>

<!-- Random background: chosen once per page load from backgrounds.json.
     One image is ever downloaded. The scrim keeps text readable on any photo. -->
<div class="bg" id="bg" aria-hidden="true"></div>
<div class="bg-scrim" aria-hidden="true"></div>

<aside class="bg-credit" id="bg-credit" hidden>
  <span id="bg-credit-text">Photo: —</span>
</aside>

<header class="site-header">
  <button type="button" class="btn-back" id="btn-back" hidden>Back</button>
  <span class="wordmark">MacEng Practice</span>
</header>

<main class="col">

  <!-- START: course selection -->
  <section class="view" data-view="select">
    <div class="bookmark-row" id="course-bookmarks">
      <button type="button" class="bookmark" data-course="1ZA3">
        <span class="bookmark-label">1ZA3 <span class="dot">•</span> Linear Algebra</span>
      </button>
      <button type="button" class="bookmark" data-course="1ZC3">
        <span class="bookmark-label">1ZC3 <span class="dot">•</span> Calculus</span>
      </button>
    </div>
  </section>

  <!-- QUESTION → ANSWER (sample loop) -->
  <section class="view" data-view="question" hidden>
    <article class="card">
      <div class="q-text" id="q-text"><!-- question --></div>
      <div class="a-box" id="a-box" hidden><!-- answer --></div>
    </article>
    <button type="button" class="btn-main" id="btn-main">Show answer</button>
  </section>

</main>

<footer class="site-footer">
  Not affiliated with or endorsed by McMaster University.
</footer>

<script src="app.js?v=8"></script>
</body>
</html>
